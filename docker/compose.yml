# Test SSH servers. Run docker/gen-keys.sh first.
services:
  ssh-password:
    build: .
    container_name: sshc-password
    environment: { MODE: password }
    ports: ["127.0.0.1:2222:22"]
  ssh-key:
    build: .
    container_name: sshc-key
    environment: { MODE: key }
    ports: ["127.0.0.1:2223:22"]
    volumes:
      - ./keys:/keys:ro
      - /var/run/docker.sock:/var/run/docker.sock
  ssh-ftp:
    build: .
    container_name: sshc-ftp
    environment: { MODE: ftp }
    ports: ["127.0.0.1:2224:22", "127.0.0.1:21:21"]
