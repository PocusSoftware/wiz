[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dev: keep line tables for backtraces but skip full debuginfo (less to write and link).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `cargo build --profile fast`: optimized, but incremental and no LTO. For trying
# performance-sensitive things (startup, transfers) without the 1-3 minute release build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
