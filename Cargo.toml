[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.16.0"
license = "MIT"

# The rules behind these are in AGENTS.md. Warnings count as failures.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = { level = "deny" }
unused_qualifications = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
# Leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Work that does nothing: copies, wrappers and conversions with no effect.
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
needless_collect = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
manual_let_else = "warn"
# Arguments taken the way the function uses them.
trivially_copy_pass_by_ref = "warn"
# Silencing a lint needs `#[expect(..., reason = "...")]`, which fails once it is stale.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# A wrapped integer in the shipped binary is worse than a clean panic.
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dev: keep line tables for backtraces but skip full debuginfo (less to write and link).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `cargo build --profile fast`: optimized, but incremental and no LTO. For trying
# performance-sensitive things (startup, transfers) without the 1-3 minute release build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
