[package]
name = "ssh-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "wiz"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alacritty_terminal = "0.26"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
gpui = "0.2.2"
ssh-core = { path = "../core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net", "process"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSEvent", "NSApplication", "NSResponder", "NSView", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3.27.0"
