[package]
name = "ssh-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ssh-client"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
gpui = "0.2.2"
ssh-core = { path = "../core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync"] }
