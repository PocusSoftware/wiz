[package]
name = "wiz-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
alacritty_terminal = { version = "0.26.0", default-features = false }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
getrandom = "0.4.3"
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process"] }
toml = "1.2.3"
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["signal"] }
