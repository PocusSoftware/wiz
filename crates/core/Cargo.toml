[package]
name = "ssh-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
alacritty_terminal = "0.26.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
bollard = "0.21.1"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.3.4"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
toml = "1.1.6"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
crossterm = "0.29.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["signal"] }
